# Orbit lock screen (asahi branch): neutral, macOS-like. Fixed greys and
# white instead of palette colours; Inter set through Pango markup because
# generate-hyprlock-colors rewrites every font_family line to the display font.

# Generated palette variables (unused here, kept so the adapter stays valid)
source = ~/.config/hypr/hyprlock-colors.conf

# Orbit Wallpaper Engine background: the solid colour the lock animation lands on
source = ~/.cache/orbit-wallpaper-engine/hyprlock-background.conf

general {
    hide_cursor = true
    ignore_empty_input = true
}

# Date, small, above the time
label {
    monitor =
    text = cmd[update:60000] echo "<span font_family='Inter' font_weight='500'>$(date +'%A, %-d %B')</span>"
    font_size = 17
    font_family = JetBrains Mono
    color = rgba(245, 245, 247, 0.78)
    position = 0, -110
    halign = center
    valign = top
}

# Time, large and light
label {
    monitor =
    text = cmd[update:1000] echo "<span font_family='Inter' font_weight='600' letter_spacing='-2048'>$(date +%H:%M)</span>"
    font_size = 104
    font_family = JetBrains Mono
    color = rgba(245, 245, 247, 0.95)
    position = 0, -140
    halign = center
    valign = top
}

# User name above the password pill
label {
    monitor =
    text = <span font_family='Inter' font_weight='600'>$USER</span>
    font_size = 14
    font_family = JetBrains Mono
    color = rgba(245, 245, 247, 0.9)
    position = 0, 205
    halign = center
    valign = bottom
}

# Password pill: frosted, borderless, fully rounded
input-field {
    monitor =
    font_family = JetBrains Mono
    size = 240, 40
    rounding = -1
    outline_thickness = 1
    outer_color = rgba(255, 255, 255, 0.14)
    inner_color = rgba(255, 255, 255, 0.10)
    font_color = rgba(245, 245, 247, 0.95)
    check_color = rgba(255, 255, 255, 0.30)
    fail_color = rgba(223, 138, 138, 0.70)
    fail_text = <span font_family='Inter'>Try again</span>
    capslock_color = rgba(255, 255, 255, 0.30)
    fade_on_empty = false
    dots_center = true
    dots_size = 0.22
    dots_spacing = 0.35
    placeholder_text = <span font_family='Inter' foreground='##f5f5f799'>Enter Password</span>
    position = 0, 150
    halign = center
    valign = bottom
}

# Battery, bottom right (laptops; empty on machines without one)
label {
    monitor =
    text = cmd[update:30000] ~/.config/hypr/scripts/lock-battery
    font_size = 13
    font_family = JetBrains Mono
    color = rgba(245, 245, 247, 0.7)
    position = -32, 28
    halign = right
    valign = bottom
}
