# One palette for everything. Noctalia's palette drives the bar, GTK/Qt,
# terminals, Hyprland borders, Hyprlock and (through the colors_changed hook)
# the Orbit Wallpaper Engine. Noctalia's own wallpaper is disabled.
#
# Orbit-Mono (palettes/Orbit-Mono.json): graphite surfaces, near-white
# accents, warm neutrals in the terminal, no blue or green. For a builtin
# instead, set source = "builtin" and builtin = one of: Ayu | Catppuccin |
# Dracula | Eldritch | Gruvbox | Kanagawa | Noctalia | Nord | Rosé Pine |
# Tokyo-Night
[theme]
mode = "dark"
source = "custom"
custom_palette = "Orbit-Mono"
