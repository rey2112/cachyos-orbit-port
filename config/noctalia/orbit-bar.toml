# Orbit bar look for Noctalia, measured from the Orbit author's showcase video
# (1080p): a fully transparent 26px strip with a launcher on the left, the
# time in the middle and status icons on the right, all in a muted foreground.
# The bar is named Top: Orbit's global menu and session animations address it
# by that name.
#
# This file sorts after config.toml, so its values win there. Changes saved in
# Noctalia's settings window (~/.local/state/noctalia/settings.toml) still win
# over this file.

# CachyOS's config.toml sets ui_scale = 1.20, which makes every bar, panel and
# font 20% larger than the reference.
[accessibility]
ui_scale = 1.0

[shell]
font_family = "JetBrains Mono"

[shell.panel]
launcher_placement = "floating"
clipboard_placement = "floating"
control_center_placement = "floating"
wallpaper_placement = "floating"
session_placement = "floating"
open_near_click_control_center = true
open_near_click_session = true

[bar.Top]
position = "top"
thickness = 26
scale = 1.0
font_scale = 1.0
background_opacity = 0.0
compositor_blur = false
shadow = false
border_width = 0.0
margin_edge = 0
margin_ends = 0
padding = 12
widget_spacing = 14
concave_edge_corners = false
radius_top_left = 0
radius_top_right = 0
radius_bottom_left = 0
radius_bottom_right = 0
capsule = false
start = ["launcher"]
center = ["clock"]
end = ["local/orbit-wallpaper-engine:widget", "tray", "bluetooth", "network", "volume", "control-center", "session"]

# Per-widget colours override the bar foreground, and CachyOS's config.toml
# sets them, so set every bar widget explicitly.
[widget.launcher]
color = "on_surface_variant"
capsule = false

[widget.clock]
color = "on_surface_variant"
capsule = false
format = "{:%H:%M}"

[widget.tray]
capsule = false

[widget.bluetooth]
color = "on_surface_variant"
capsule = false

[widget.network]
color = "on_surface_variant"
capsule = false

[widget.volume]
color = "on_surface_variant"
capsule = false

[widget.control-center]
color = "on_surface_variant"
capsule = false

[widget.session]
color = "on_surface_variant"
capsule = false

# Orbit Wallpaper Engine's bar button (opens its settings), installed by
# bin/dotfiles-install-wallpaper. Plugins enabled in Noctalia's settings
# window replace this list.
[plugins]
enabled = ["local/orbit-wallpaper-engine"]
