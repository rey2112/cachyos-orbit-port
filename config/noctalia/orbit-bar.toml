# Orbit bar look for Noctalia. Edit freely: this file only styles the bar.
# It sorts after config.toml, so these values win over the same keys there;
# delete a line here to fall back to config.toml. Changes made in Noctalia's
# settings window (~/.local/state/noctalia/settings.toml) still win over this.
#
# The thin full-width strip from the Orbit author's showcase, fully
# see-through (no background, no blur) and with the full widget set. The bar
# is named Top: Orbit's global menu and session animations address it by
# that name. The dock below
# is the floating island. Panels opened from the bar float with their own
# solid background.

[shell]
font_family = "JetBrains Mono"

[shell.panel]
launcher_placement = "floating"
clipboard_placement = "floating"
control_center_placement = "floating"
wallpaper_placement = "floating"
session_placement = "floating"
open_near_click_control_center = true
open_near_click_session = true

[bar.Top]
position = "top"
thickness = 28
scale = 1.0
font_scale = 0.9
background_opacity = 0.0
compositor_blur = false
shadow = false
margin_edge = 0
margin_ends = 0
padding = 10
widget_spacing = 12
concave_edge_corners = false
radius_top_left = 0
radius_top_right = 0
radius_bottom_left = 0
radius_bottom_right = 0
capsule = false
start = ["launcher", "workspaces", "active_window"]
center = ["clock"]
end = ["media", "tray", "network", "volume", "notifications", "session"]

# Per-widget colours override the bar foreground, and CachyOS's config.toml
# sets them, so set every bar widget explicitly.
[widget.launcher]
color = "primary"
capsule = false

[widget.active_window]
color = "on_surface"
capsule = false

[widget.media]
color = "on_surface"
capsule = false

[widget.network]
color = "on_surface"
capsule = false

[widget.volume]
color = "on_surface"
capsule = false

[widget.notifications]
color = "on_surface"
capsule = false

[widget.clock]
color = "on_surface"
capsule = false
format = "{:%a %d %b  %H:%M}"

[widget.session]
color = "on_surface"
capsule = false

[widget.tray]
capsule = false

# Numbered workspaces; Orbit keeps workspaces 1-5 per monitor persistent.
[widget.workspaces]
capsule = false
style = "regular"
show_labels = true
label_source = "id"
focused_color = "primary"
occupied_color = "on_surface"
empty_color = "outline"
