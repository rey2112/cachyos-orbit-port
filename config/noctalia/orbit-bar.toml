# Orbit bar look for Noctalia. Edit freely: this file only styles the bar.
# It sorts after config.toml, so these values win over the same keys there;
# delete a line here to fall back to config.toml. Changes made in Noctalia's
# settings window (~/.local/state/noctalia/settings.toml) still win over this.
#
# A clear bar with liquid-glass pills (fully round, faint white edge, no
# hard outline) in JetBrains Mono Medium: launcher and workspaces,
# now playing, clock, weather and system stats, tray and status icons. The bar
# is named Top: Orbit's global menu and session animations address it by
# that name. The dock below is the floating island.

[shell]
font_family = "JetBrains Mono"

[shell.panel]
launcher_placement = "floating"
clipboard_placement = "floating"
control_center_placement = "floating"
wallpaper_placement = "floating"
session_placement = "floating"
open_near_click_control_center = true
open_near_click_session = true

[bar.Top]
position = "top"
thickness = 34
scale = 1.0
font_scale = 0.95
font_weight = 500
background_opacity = 0.0
compositor_blur = false
shadow = false
border_width = 0.0
margin_edge = 6
margin_ends = 10
padding = 0
widget_spacing = 8
concave_edge_corners = false
radius_top_left = 0
radius_top_right = 0
radius_bottom_left = 0
radius_bottom_right = 0
capsule = false
start = ["group:nav", "group:media"]
center = ["group:time"]
end = ["group:info", "group:system"]

    # Liquid-glass islands on a clear bar: Hyprglass renders the glass where
    # the islands paint (hyprland.lua). Arrays replace config.toml's groups.
    [[bar.Top.capsule_group]]
    id = "nav"
    members = ["launcher", "workspaces"]
    fill = "surface"
    opacity = 0.32
    border = "#FFFFFF1F"
    border_width = 1.0
    padding = 10.0
    widget_spacing = 10

    # Now playing gets its own island beside the workspaces; it hides
    # itself (and the island) when nothing is playing.
    [[bar.Top.capsule_group]]
    id = "media"
    members = ["media"]
    fill = "surface"
    opacity = 0.32
    border = "#FFFFFF1F"
    border_width = 1.0
    padding = 12.0
    widget_spacing = 8

    [[bar.Top.capsule_group]]
    id = "time"
    members = ["clock"]
    fill = "surface"
    opacity = 0.32
    border = "#FFFFFF1F"
    border_width = 1.0
    padding = 12.0
    widget_spacing = 12

    [[bar.Top.capsule_group]]
    id = "info"
    members = ["weather", "cpu", "ram"]
    fill = "surface"
    opacity = 0.32
    border = "#FFFFFF1F"
    border_width = 1.0
    padding = 10.0
    widget_spacing = 12

    [[bar.Top.capsule_group]]
    id = "system"
    members = ["tray", "bluetooth", "network", "volume", "brightness", "battery", "notifications", "session"]
    fill = "surface"
    opacity = 0.32
    border = "#FFFFFF1F"
    border_width = 1.0
    padding = 10.0
    widget_spacing = 10

# Per-widget colours override the bar foreground, and CachyOS's config.toml
# sets them, so set every bar widget explicitly.
[widget.launcher]
color = "on_surface"
capsule = false

[widget.active_window]
color = "on_surface"
capsule = false

[widget.media]
color = "on_surface"
capsule = false
hide_album_art = true
hide_when_no_media = true
# Lengths are pixels: the island hugs the title up to max_length, then
# scrolls the title on hover.
min_length = 0
max_length = 360
title_scroll = "on_hover"

[widget.network]
color = "on_surface"
capsule = false
# Icon only: no connection name next to it.
show_label = false
show_vpn_label = false

[widget.volume]
color = "on_surface"
capsule = false

[widget.notifications]
color = "on_surface"
capsule = false

[widget.clock]
color = "on_surface"
capsule = false
font_weight = 700
format = "{:%a %d %b  %H:%M}"

[widget.weather]
color = "on_surface"
capsule = false
show_condition = false
show_temperature = true

# Two system-monitor instances (named here, typed as sysmon).
[widget.cpu]
type = "sysmon"
stat = "cpu_usage"
color = "on_surface"
capsule = false
show_glyph = true
show_value = true

[widget.ram]
type = "sysmon"
stat = "ram_pct"
color = "on_surface"
capsule = false
show_glyph = true
show_value = true

# Laptop (asahi branch): screen brightness and battery with its percentage.
[widget.brightness]
color = "on_surface"
capsule = false
show_label = false

[widget.battery]
color = "on_surface"
capsule = false
show_label = true

[widget.bluetooth]
color = "on_surface"
capsule = false
hide_when_no_connected_device = true

[widget.session]
color = "on_surface"
capsule = false

[widget.tray]
capsule = false

# Numbered workspaces; Orbit keeps workspaces 1-5 per monitor persistent.
# Only the current workspace is a bright pill; the rest are slim dark pills
# with light numbers (empty ones fainter), so a busy desktop stays calm.
[widget.workspaces]
capsule = false
font_weight = 700
style = "regular"
show_labels = true
label_source = "id"
pill_scale = 0.8
focused_color = "on_surface"
occupied_color = "surface_variant"
empty_color = "surface_variant"
change_color_on_hover = true

# Weather needs a location: resolved from your IP address. Set
# auto_locate = false and address = "City" to pin one instead.
[location]
auto_locate = true

# Orbit Wallpaper Engine's bar button (opens its settings), installed by
# bin/dotfiles-install-wallpaper. Plugins enabled in Noctalia's settings
# window replace this list.
[plugins]
enabled = ["local/orbit-wallpaper-engine"]
