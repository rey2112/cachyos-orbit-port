# Orbit bar look for Noctalia. Edit freely: this file only styles the bar.
# It sorts after config.toml, so these values win over the same keys there;
# delete a line here to fall back to config.toml. Changes made in Noctalia's
# settings window (~/.local/state/noctalia/settings.toml) still win over this.
#
# Matches the bar in the Orbit author's showcase: one thin, dark, full-width
# strip named Top (Orbit's global menu and session animations address the bar
# by that name) with the launcher, a centred clock, and status icons. The dock
# below it is the floating island. Panels opened from the bar float with their
# own solid background.

[shell]
font_family = "JetBrains Mono"

[shell.panel]
launcher_placement = "floating"
clipboard_placement = "floating"
control_center_placement = "floating"
wallpaper_placement = "floating"
session_placement = "floating"
open_near_click_control_center = true
open_near_click_session = true

[bar.Top]
position = "top"
thickness = 26
scale = 1.0
font_scale = 0.9
background_opacity = 0.92
compositor_blur = true
shadow = false
margin_edge = 0
margin_ends = 0
padding = 8
widget_spacing = 10
concave_edge_corners = false
radius_top_left = 0
radius_top_right = 0
radius_bottom_left = 0
radius_bottom_right = 0
capsule = false
start = ["launcher"]
center = ["clock"]
end = ["tray", "network", "volume", "notifications", "session"]
# Arrays replace config.toml's wholesale: no capsule islands on this bar.
capsule_group = []

# Per-widget colours override the bar foreground, and CachyOS's config.toml
# sets them, so set every bar widget explicitly.
[widget.launcher]
color = "on_surface"
capsule = false

[widget.network]
color = "on_surface"
capsule = false

[widget.volume]
color = "on_surface"
capsule = false

[widget.notifications]
color = "on_surface"
capsule = false

[widget.clock]
color = "on_surface"
capsule = false
format = "{:%H:%M}"

[widget.session]
color = "on_surface"
capsule = false

[widget.tray]
capsule = false
