# Floating island dock measured from the Orbit author's showcase (1080p):
# 46px tall, 12px off the bottom edge, near-opaque, launcher grid first.
[dock]
background_opacity = 0.85
margin_edge = 12
concave_edge_corners = false
radius = 16
radius_top_left = 16
radius_top_right = 16
radius_bottom_left = 16
radius_bottom_right = 16
icon_size = 32
main_axis_padding = 10
cross_axis_padding = 7
item_spacing = 12
border_width = 0.0
inactive_scale = 1.0
inactive_opacity = 1.0
show_dots = true
launcher_position = "start"
# Orbit Wallpaper Engine settings first. Desktop entry IDs (file name without
# .desktop). Pins saved from the dock's right-click menu replace this list.
pinned = ["orbit-wallpaper-engine-settings", "firefox", "org.wezfurlong.wezterm", "org.gnome.Nautilus"]

[notification]
background_opacity = 0.9

[osd]
background_opacity = 0.85

# Pop-up panels (control centre, launcher, calendar, session) stay solid so
# they are readable over the transparent bar and the animated wallpaper.
[shell.panel]
transparency_mode = "solid"
