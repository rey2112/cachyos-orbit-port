# Floating liquid-glass dock: lifted off the screen edge, rounded on all
# sides, compact icons, thin outline. Hyprglass draws the glass.
[dock]
background_opacity = 0.25
shadow = false
margin_edge = 8
concave_edge_corners = false
radius = 20
radius_top_left = 20
radius_top_right = 20
radius_bottom_left = 20
radius_bottom_right = 20
icon_size = 28
main_axis_padding = 8
cross_axis_padding = 5
item_spacing = 5
border_width = 1.0
inactive_scale = 1.0
inactive_opacity = 0.9
magnification_scale = 1.25
show_dots = true
# Application launcher button at the start of the dock.
launcher_position = "start"
# Orbit Wallpaper Engine settings first. Desktop entry IDs (file name without
# .desktop). Pins saved from the dock's right-click menu replace this list.
pinned = ["orbit-wallpaper-engine-settings", "firefox", "org.wezfurlong.wezterm", "org.gnome.Nautilus"]

[notification]
background_opacity = 0.35

[osd]
background_opacity = 0.35

# Glass panels (control centre, launcher, calendar, session). Shadows off:
# Hyprglass would otherwise glass the shadow halo too.
[shell.panel]
transparency_mode = "glass"
shadow = false
