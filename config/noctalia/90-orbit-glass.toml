# Floating island dock, as in the Orbit author's showcase: lifted off the
# screen edge, rounded on all sides, compact icons, thin outline.
[dock]
background_opacity = 0.7
margin_edge = 8
concave_edge_corners = false
radius = 18
radius_top_left = 18
radius_top_right = 18
radius_bottom_left = 18
radius_bottom_right = 18
icon_size = 36
main_axis_padding = 10
cross_axis_padding = 6
item_spacing = 6
border_width = 1.0
inactive_scale = 1.0
inactive_opacity = 0.9
magnification_scale = 1.25
show_dots = true

[notification]
background_opacity = 0.9

[osd]
background_opacity = 0.85

# Pop-up panels (control centre, launcher, calendar, session) stay solid so
# they are readable over the transparent bar and the animated wallpaper.
[shell.panel]
transparency_mode = "solid"
