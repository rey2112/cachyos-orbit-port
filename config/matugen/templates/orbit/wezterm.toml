# Generated by matugen from Orbit's config/matugen/templates/orbit/wezterm.toml.
# Terminal hues are matugen custom colours blended toward the palette.
[colors]
ansi = [
    "{{colors.surface_container_highest.default.hex}}",
    "{{colors.red.default.hex}}",
    "{{colors.green.default.hex}}",
    "{{colors.yellow.default.hex}}",
    "{{colors.blue.default.hex}}",
    "{{colors.magenta.default.hex}}",
    "{{colors.cyan.default.hex}}",
    "{{colors.on_surface_variant.default.hex}}",
]
background = "{{colors.surface.default.hex}}"
brights = [
    "{{colors.outline.default.hex}}",
    "{{colors.on_red_container.default.hex}}",
    "{{colors.on_green_container.default.hex}}",
    "{{colors.on_yellow_container.default.hex}}",
    "{{colors.on_blue_container.default.hex}}",
    "{{colors.on_magenta_container.default.hex}}",
    "{{colors.on_cyan_container.default.hex}}",
    "{{colors.on_surface.default.hex}}",
]
compose_cursor = "{{colors.primary.default.hex}}"
cursor_bg = "{{colors.primary.default.hex}}"
cursor_border = "{{colors.primary.default.hex}}"
cursor_fg = "{{colors.on_primary.default.hex}}"
foreground = "{{colors.on_surface.default.hex}}"
scrollbar_thumb = "{{colors.secondary_container.default.hex}}"
selection_bg = "{{colors.secondary_container.default.hex}}"
selection_fg = "{{colors.on_secondary_container.default.hex}}"
split = "{{colors.outline_variant.default.hex}}"
visual_bell = "{{colors.surface_container_highest.default.hex}}"

[colors.tab_bar]
background = "{{colors.surface_container_lowest.default.hex}}"
inactive_tab_edge = "{{colors.secondary_container.default.hex}}"

[colors.tab_bar.active_tab]
bg_color = "{{colors.primary.default.hex}}"
fg_color = "{{colors.on_primary.default.hex}}"

[colors.tab_bar.inactive_tab]
bg_color = "{{colors.surface_container_low.default.hex}}"
fg_color = "{{colors.on_surface.default.hex}}"
