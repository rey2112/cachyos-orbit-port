# Orbit-owned matugen config for the end-4 (illogical-impulse) shell.
# end-4's switchwall.sh runs matugen with this file. It renders end-4's own
# templates (installed by bin/install-end4-shell into templates/) except that
# GTK output goes to noctalia.css, which Orbit's gtk.css imports, instead of
# overwriting gtk.css (an Orbit symlink). end-4's Hyprland/hyprlock colour
# outputs are dropped: Orbit owns those through the two templates at the end.

[config]
version_check = false

# Terminal hues for Orbit's WezTerm palette, blended toward the source colour.
[config.custom_colors]
red = { color = "#e05561", blend = true }
green = { color = "#8cc265", blend = true }
yellow = { color = "#d8a657", blend = true }
blue = { color = "#4aa5f0", blend = true }
magenta = { color = "#c162de", blend = true }
cyan = { color = "#42b3c2", blend = true }

# --- end-4 shell ---
[templates.m3colors]
input_path = '~/.config/matugen/templates/colors.json'
output_path = '~/.local/state/quickshell/user/generated/colors.json'

[templates.fuzzel]
input_path = '~/.config/matugen/templates/fuzzel/fuzzel_theme.ini'
output_path = '~/.config/fuzzel/fuzzel_theme.ini'

[templates.gtk3]
input_path = '~/.config/matugen/templates/gtk-3.0/gtk.css'
output_path = '~/.config/gtk-3.0/noctalia.css'

[templates.gtk4]
input_path = '~/.config/matugen/templates/gtk-4.0/gtk.css'
output_path = '~/.config/gtk-4.0/noctalia.css'

[templates.kde_colors]
input_path = '~/.config/matugen/templates/kde/color.txt'
output_path = '~/.local/state/quickshell/user/generated/color.txt'

[templates.wallpaper]
input_path = '~/.config/matugen/templates/wallpaper.txt'
output_path = '~/.local/state/quickshell/user/generated/wallpaper/path.txt'

# --- Orbit palette (read by hyprland.lua, orbit-theme, Wallpaper Engine) ---
[templates.orbit_hyprland]
input_path = '~/.config/matugen/templates/orbit/noctalia.lua'
output_path = '~/.config/hypr/noctalia.lua'

[templates.orbit_wezterm]
input_path = '~/.config/matugen/templates/orbit/wezterm.toml'
output_path = '~/.config/wezterm/colors/Noctalia.toml'
post_hook = 'sh -c "~/.local/bin/orbit-update-all-colors noctalia; ~/.config/hypr/scripts/wallpaper-animation palette" >/dev/null 2>&1 &'
